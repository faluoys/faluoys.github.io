faq:
  title: 常见问题
  description: 关于我的工作流程和服务的常见问题解答。
  categories:
    - title: 服务与流程
      questions:
        - label: 你提供哪些服务？
          content: |
            我专注于 UX/UI 设计和前端开发，包括用户研究、线框图、交互原型、直观的用户界面设计、响应式网站和 Web 应用开发（尤其是 Vue.js/Nuxt.js），以及设计系统搭建。我的目标是从概念到上线，打造流畅的数字体验。
        - label: 你的设计流程是怎样的？
          content: |
            我的流程注重协作和迭代，通常包括调研与发现、构思与原型、用户测试、视觉设计，以及在开发阶段与研发团队紧密配合。我会根据项目需求灵活调整流程，始终以用户为中心。
        - label: 你和初创公司合作吗？
          content: |
            当然！我很喜欢和初创公司合作，帮助他们塑造产品愿景，从零开始打造友好的用户界面。我能调整自己的流程，适应初创公司快节奏的环境。
    - title: 价格与周期
      questions:
        - label: 一个项目通常收费多少？
          content: |
            项目费用取决于范围、复杂度、功能和周期。完整的 UX/UI 设计加前端开发项目通常 5,000 美元起，一般项目在 8,000 到 25,000 美元之间。咨询或单项设计任务按天计费，日薪 700 美元。
        - label: 付款方式是怎样的？
          content: |
            通常需要先支付 40% 定金来排期并启动项目，剩余 60% 在项目顺利完成并交付后支付。支持银行转账和 Stripe 付款。
        - label: 一个项目一般需要多长时间？
          content: |
            周期很大程度上取决于项目范围和复杂度。小项目可能需要 3-4 周，规模较大、较复杂的项目可能需要 2 到 4 个月。在初期调研阶段结束后，我都会提供详细的时间预估。
        - label: 你提供长期合作或持续支持吗？
          content: |
            提供。对于需要持续设计支持、功能开发或维护的客户，我提供按月计费的长期合作方案，可以按具体需求定制。如果你感兴趣，欢迎来聊聊。
    - title: 关于我
      questions:
        - label: 你最喜欢这份工作的哪一点？
          content: |
            我喜欢通过设计和技术解决复杂问题的挑战。看到人们使用我做的东西，并觉得它真正有用、好上手，这是非常有成就感的事。在用户需求和技术可能性之间架起桥梁，是最让我兴奋的。
        - label: 工作之外你有什么爱好？
          content: |
            不设计、不写代码的时候，我喜欢逛波士顿的各个街区、探店新开的咖啡馆，或者去附近的自然保护区徒步。我也热爱摄影，偶尔会参与开源项目。
