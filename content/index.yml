faq:
  title: 常见问题
  description: 关于我和这个博客，你可能想知道的事。
  categories:
    - title: 关于博客
      questions:
        - label: 这个博客主要写什么？
          content: |
            以前端技术为主：Vue / Nuxt 实践、TypeScript、前端工程化、性能优化，以及日常开发中的踩坑记录，偶尔也会写一些学习方法和生活随想。
        - label: 怎么及时收到更新？
          content: |
            可以通过 [RSS](/rss.xml) 订阅，也可以在掘金或 GitHub 关注我。
        - label: 文章可以转载吗？
          content: |
            欢迎转载，请注明作者和原文链接。
    - title: 技术栈
      questions:
        - label: 这个博客是用什么搭建的？
          content: |
            基于 [Nuxt 4](https://nuxt.com)、[Nuxt UI](https://ui.nuxt.com) 和 [Nuxt Content](https://content.nuxt.com) 搭建，文章用 Markdown 编写，静态生成后部署。
        - label: 博客的源码可以参考吗？
          content: |
            可以，源码在 [GitHub](https://github.com/faluoys/nuxt-portfolio) 上公开。
    - title: 联系我
      questions:
        - label: 怎么联系你？
          content: |
            可以发邮件到 [zflqljaq@gmail.com](mailto:zflqljaq@gmail.com)，也可以在 GitHub、X 或掘金上找到我。
        - label: 发现文章有错误怎么办？
          content: |
            非常欢迎指正！可以发邮件告诉我，或者在 GitHub 仓库提 Issue。
