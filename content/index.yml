about:
  title: "关于我"
  description: |
    作为一名拥有 6 年经验的 UX/UI 设计师和前端开发者，我运用在波士顿大学交互设计专业所学，打造以用户为中心的数字体验。
    我的方法融合了创意策略与技术专长，把概念转化为实用、有目标的数字产品，让设计与技术无缝结合。
