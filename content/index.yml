about:
  title: "关于我"
  description: |
    我是一名前端开发工程师，日常主要使用 Vue、Nuxt 和 TypeScript，关注前端工程化、组件设计与用户体验。
    写博客是为了把学到的知识和踩过的坑沉淀下来，也希望能帮到遇到同样问题的你。
