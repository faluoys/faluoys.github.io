title: 关于我
description: 了解我作为一名前端开发工程师的成长历程、设计理念，以及我对打造直观数字体验的热爱。
content: |
  你好，我是 **faluoys**，一名前端开发工程师。过去六年里，我一直沉浸在数字产品的创造中，专注于打造不仅好用、而且真正直观、吸引人的用户体验。

  我的道路始于 **波士顿大学**，在那里我获得了交互设计学位。也正是在那里，我发现了自己对设计的视觉语言和代码的逻辑之美的双重热爱。从那以后，我在这两个领域不断精进，因为我相信，最好的数字产品源自对美学和实现两方面的深刻理解。

  ### 我的设计理念

  我的设计理念植根于 **同理心** 和 **解决问题**。我相信好的设计始于理解"为什么"——用户的需求、动机和痛点。我通过调研、迭代原型（通常用 Figma 等工具）和用户测试，确保我做出的方案真正有效。

  我努力打造让人感觉毫不费力的界面，让功能与美感相辅相成。无论是打磨像素级精确的 UI，还是编写整洁的 Vue.js/Nuxt.js 代码，我始终关注为最终用户创造价值。

  ### 我的动力

  让我对这份工作保持热情的，是持续不断的学习，以及把复杂想法转化为简洁优雅方案的挑战。没有什么比看到设计落地、并知道它让别人的数字体验更轻松或更愉快更有成就感了。

  ### 屏幕之外

  不设计、不写代码的时候，你可能会看到我在探店波士顿新开的咖啡馆、在附近的步道徒步，或者偶尔为开源项目做贡献。

  感谢你的到访。欢迎浏览我的 [项目](/projects)，如果想合作也欢迎 [联系我](/#contact)！
