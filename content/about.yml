title: 关于我
description: 一名热爱 Web 的前端开发工程师，喜欢折腾新技术，也喜欢把学到的东西写下来。
content: |
  你好，我是 **faluoys**，一名前端开发工程师。

  日常主要使用 **Vue**、**Nuxt** 和 **TypeScript**，对前端工程化、组件设计和用户体验比较感兴趣。我相信好的产品既要好用也要好看，而这两者都离不开对细节的打磨。

  ### 为什么写博客

  写博客是我学习和沉淀的方式。把一个问题讲清楚，往往比解决它更能加深理解。如果这些文章恰好也能帮到你，那就再好不过了。

  ### 我在关注什么

  - Vue / Nuxt 生态与最佳实践
  - TypeScript 与前端工程化
  - Web 性能优化与可访问性
  - 组件库与设计系统

  ### 找到我

  - 邮箱：[zflqljaq@gmail.com](mailto:zflqljaq@gmail.com)
  - GitHub：[faluoys](https://github.com/faluoys)
  - 掘金：[faluoys](https://juejin.cn/user/3934521496452874)
  - X：[@zflqljaq](https://x.com/zflqljaq)

  感谢你的到访！欢迎看看我的 [博客](/blog) 和 [项目](/projects)，也可以通过 [RSS](/rss.xml) 订阅更新。
